</style></head><body>
<header><button class="quiet" id="settingsBtn" aria-haspopup="dialog">⚙ 奖品设置</button></header>
<main><p class="eyebrow">SPIN OF LUCK</p><h1>好礼，转到你。</h1><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><svg id="wheel" viewBox="0 0 600 600" role="img" aria-label="奖品转盘"></svg><button class="spin" id="draw"><span id="drawText">开始抽奖</span><small>DRAW</small></button></div><p class="status" id="status" aria-live="polite">点击中央按钮开始抽奖</p><p class="hint" id="hint"></p><p id="storageNote" class="storage-note" hidden></p></main>
<dialog id="settings"><div class="modal-head"><h2>奖品设置</h2><button class="close" id="closeSettings" aria-label="关闭设置">×</button></div><div class="settings-body"><label class="settings-label" for="mode">概率模式</label><select id="mode"><option value="quantity">数量加权 · 剩余数量 × 单件权重</option><option value="custom">自定义权重 · 按奖品权重分配</option></select><p class="help" id="modeHelp"></p><div class="config-head"><span>奖品名称</span><span>总数量</span><span>剩余数量</span><span id="weightLabel">单件权重</span><span style="text-align:right">当前概率</span><span></span></div><div id="rows"></div><button class="add" id="add">＋ 添加奖品</button><p class="help">可修改名称、添加或删除奖品，支持 1–20 种。默认每种 1 份，请按实际库存调整。总数量包含本轮已抽出的数量，剩余数量根据已抽记录自动计算。库存或权重为 0 时不参与抽奖。转盘各格仅展示奖品，中奖概率以此处计算为准。</p><div class="actions"><button class="quiet" id="reset">重置本轮</button><button class="primary" id="save">保存设置</button></div><p class="message" id="message" aria-live="polite"></p><details><summary id="historySummary">中奖记录（0）</summary><div id="history"></div><button class="quiet" id="export">导出记录 ↓</button></details><p class="help" style="margin-bottom:0">删除奖品会移出奖池，已有中奖记录仍保留。设置与记录仅保存在当前浏览器。</p></div></dialog>
<dialog id="result" class="result-dialog"><div class="star">✦</div><p>恭喜抽中</p><h2 id="resultTitle"></h2><button class="primary accept-prize" id="closeResult" autofocus>收下奖品</button><button class="return-prize" id="returnPrize">放回奖池</button></dialog>
<dialog id="resetDialog" class="result-dialog"><h2 style="font-size:22px">开启新一轮？</h2><p>恢复奖品库存并清空本轮记录。<br>数量和权重设置会保留。</p><button class="primary" id="confirmReset">确认重置</button><button class="quiet" id="cancelReset">取消</button></dialog>
<script id="logic">
const NAMES=['泡沫滚轴','健身手套','瑜伽垫','抽纸','洗衣凝珠','洗衣袋三件套','小包手帕纸','便携消毒凝胶','洗手液','洗衣液'];
function defaults(){return {version:3,mode:'quantity',prizes:NAMES.map((name,i)=>({id:'wheel-'+i,name,total:1,remaining:1,weight:1})),history:[]}}
function effective(p,mode){return p.remaining>0?(mode==='quantity'?p.remaining*p.weight:p.weight):0}
function probabilities(prizes,mode){const weights=prizes.map(p=>effective(p,mode));const total=weights.reduce((a,b)=>a+b,0);return weights.map(w=>total?w/total:0)}
function pick(prizes,mode,random){const weights=prizes.map(p=>effective(p,mode));const total=weights.reduce((a,b)=>a+b,0);if(!(total>0))return -1;let cursor=random*total;for(let i=0;i<weights.length;i++){cursor-=weights[i];if(cursor<0)return i}return weights.findLastIndex(w=>w>0)}
function nextRotation(current,index,count,jitter=0){const target=((360-index*360/count+jitter)%360+360)%360;return current+1800+(target-current%360+360)%360}
function settleResult(s,accept){const pending=s.pending;if(!pending)return null;s.pending=null;const p=s.prizes.find(p=>p.id===pending.prizeId);if(!p||p.remaining<=0)return null;if(accept){p.remaining--;s.history.push({id:p.id,name:pending.name,time:pending.time})}return {name:pending.name,accepted:accept}}
</script><script>

$('mode').onchange=()=>{dirty=true;help();updateRates();message('有未保存的设置')};$('settingsBtn').onclick=()=>{renderForm();$('settings').showModal()};$('closeSettings').onclick=()=>$('settings').close();
$('save').onclick=()=>{const rows=[...$('rows').children];for(const row of rows){const field=k=>row.querySelector('[data-field="'+k+'"]'),name=field('name').value.trim(),total=Number(field('total').value),weight=Number(field('weight').value),old=state.prizes.find(p=>p.id===row.dataset.id),used=old?old.total-old.remaining:0;if(!name||name.length>24||field('total').value.trim()===''||field('weight').value.trim()===''||!Number.isInteger(total)||total<used||total>99999||total<0||!Number.isFinite(weight)||weight<0||weight>99999){message('请填写 1–24 字的名称、'+used+'–99999 的整数数量和 0–99999 的权重。',true);return}}state.prizes=draft();state.mode=$('mode').value;state.version=3;dirty=false;persist();rotation=0;$('wheel').style.transition='none';$('wheel').style.transform='rotate(0deg)';render();requestAnimationFrame(()=>requestAnimationFrame(()=>$('wheel').style.transition=''));if(state.prizes.some(p=>effective(p,state.mode)>0))$('status').textContent='设置已保存，可以开始抽奖';$('settings').close()};

function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<28;i++){const n=el('i','confetti');n.style.left=randomUnit()*100+'vw';n.style.background=['#f1b8c1','#f4d69f','#c4dfc6','#b9d8f2','#d8c5ef'][i%5];n.style.animationDelay=randomUnit()*.5+'s';document.body.append(n);setTimeout(()=>n.remove(),3300)}}
function showResult(){if(!state.pending)return;$('resultTitle').textContent=state.pending.name;if(!$('result').open)$('result').showModal()}
function decide(accept){if(!state.pending)return;const outcome=settleResult(state,accept);persist();if($('result').open)$('result').close();render();$('status').textContent=outcome?(accept?'已收下：'+outcome.name:'已放回奖池'):'请选择奖品后重试';if(!$('draw').disabled)$('draw').focus()}
async function draw(){if(busy||state.pending||$('settings').open||$('result').open||$('resetDialog').open)return;const index=pick(state.prizes,state.mode,randomUnit());if(index<0)return;busy=true;const p=state.prizes[index];state.pending={prizeId:p.id,name:p.name,time:new Date().toISOString()};persist();$('draw').disabled=true;$('drawText').textContent='转动中…';$('settingsBtn').disabled=true;$('status').textContent='正在抽奖，请稍候…';rotation=nextRotation(rotation,index,state.prizes.length,(randomUnit()-.5)*(360/state.prizes.length)*.44);$('wheel').style.transform=`rotate(${rotation}deg)`;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;await new Promise(resolve=>setTimeout(resolve,reduced?40:4300));busy=false;render();$('status').textContent='恭喜抽中：'+p.name;showResult();celebrate()}
$('draw').onclick=draw;$('closeResult').onclick=()=>decide(true);$('returnPrize').onclick=()=>decide(false);$('result').addEventListener('cancel',e=>{e.preventDefault();decide(false)});$('result').addEventListener('close',()=>{if(state.pending&&!busy&&!$('result').open)decide(false)});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();draw()}});
$('reset').onclick=()=>{if(dirty){message('请先保存设置，再重置本轮。',true);return}$('resetDialog').showModal()};$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{state.prizes.forEach(p=>p.remaining=p.total);state.history=[];persist();render();renderForm();if(state.prizes.some(p=>effective(p,state.mode)>0))$('status').textContent='新一轮抽奖已准备就绪';$('resetDialog').close();message('本轮已重置')};
$('export').onclick=()=>{if(!state.history.length){message('暂无中奖记录',true);return}const cell=v=>'"'+String(/^[=+@\t\r-]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"',csv='\uFEFF'+[['序号','奖品','时间'],...state.history.map((h,i)=>[i+1,h.name,new Date(h.time).toLocaleString('zh-CN',{hour12:false})])].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=el('a');a.href=url;a.download='抽奖记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(state.pending&&(!state.prizes.some(p=>p.id===state.pending.prizeId&&p.remaining>0)||typeof state.pending.name!=='string'||typeof state.pending.time!=='string'))state.pending=null;
render();persist();if(state.pending){$('status').textContent='请选择收下或放回上次抽中的奖品';showResult()}
</script></body></html>
